<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ước tính giá nhà bằng API dự đoán giá nhà." />
  <title>HousePrice — Ước tính giá nhà</title>
  <style>
    :root {
      --ink: #182230;
      --muted: #687386;
      --line: #dfe5ed;
      --surface: #ffffff;
      --background: #f4f7fb;
      --primary: #155eef;
      --primary-dark: #0d47bf;
      --success: #087443;
      --danger: #c43232;
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, #dceaff 0, transparent 32rem),
        var(--background);
    }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 48px;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      color: white;
      background: var(--primary);
      border-radius: 13px;
      box-shadow: 0 8px 20px #155eef33;
    }
    .brand-mark svg { width: 23px; }
    .status { color: var(--muted); font-size: .9rem; }

    main { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: stretch; }
    .intro { display: flex; flex-direction: column; justify-content: center; padding: 12px 10px 12px 0; }
    .eyebrow { margin: 0 0 14px; color: var(--primary); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 520px; margin: 0; font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: .98; letter-spacing: -.065em; }
    .intro p { max-width: 470px; margin: 22px 0 0; color: var(--muted); font-size: 1.08rem; line-height: 1.7; }

    .card { padding: clamp(24px, 4vw, 38px); background: var(--surface); border: 1px solid #e8edf3; border-radius: var(--radius); box-shadow: 0 20px 55px #27364d12; }
    .card h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.025em; }
    .card-intro { margin: 7px 0 25px; color: var(--muted); font-size: .93rem; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-size: .87rem; font-weight: 700; }
    .input-wrap { position: relative; }
    input, select {
      width: 100%;
      min-height: 50px;
      padding: 0 14px;
      color: var(--ink);
      background: #fbfcfe;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: 0;
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px #155eef1c; }
    .unit { position: absolute; top: 50%; right: 14px; color: var(--muted); font-size: .85rem; transform: translateY(-50%); pointer-events: none; }
    input.has-unit { padding-right: 54px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    button {
      width: 100%;
      min-height: 52px;
      margin-top: 5px;
      color: white;
      background: var(--primary);
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: background .2s, transform .2s;
    }
    button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .7; transform: none; }

    .result { display: none; margin-top: 22px; padding: 19px; background: #eefbf5; border: 1px solid #bdebd3; border-radius: 13px; }
    .result.visible { display: block; }
    .result-label { color: var(--success); font-size: .82rem; font-weight: 700; }
    .price { margin-top: 5px; color: var(--success); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 850; letter-spacing: -.04em; }
    .result-detail { margin: 5px 0 0; color: #4c7661; font-size: .82rem; }
    .error { display: none; margin-top: 16px; color: var(--danger); font-size: .88rem; line-height: 1.5; }
    .error.visible { display: block; }

    @media (max-width: 760px) {
      .shell { padding-top: 22px; }
      header { margin-bottom: 28px; }
      .status { display: none; }
      main { grid-template-columns: 1fr; gap: 26px; }
      .intro { padding: 0; }
      h1 { max-width: 620px; }
    }
    @media (max-width: 430px) { .grid { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg>
        </span>
        <span>HousePrice</span>
      </div>
      <span class="status">Mini prediction API</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Ước tính nhanh · Việt Nam</p>
        <h1>Biết giá trị căn nhà của bạn.</h1>
        <p>Nhập một vài thông tin cơ bản để nhận mức giá tham khảo được tính toán ngay lập tức.</p>
      </section>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Thông tin căn nhà</h2>
        <p class="card-intro">Các trường có dấu <span aria-hidden="true">*</span> là bắt buộc.</p>
        <form id="prediction-form">
          <div class="field">
            <label for="area">Diện tích <span aria-hidden="true">*</span></label>
            <div class="input-wrap">
              <input class="has-unit" id="area" name="area" type="number" min="1" step="0.1" placeholder="Ví dụ: 80" required />
              <span class="unit">m²</span>
            </div>
          </div>

          <div class="grid">
            <div class="field">
              <label for="bedrooms">Số phòng ngủ <span aria-hidden="true">*</span></label>
              <input id="bedrooms" name="bedrooms" type="number" min="0" step="1" placeholder="Ví dụ: 3" required />
            </div>
            <div class="field">
              <label for="location">Khu vực</label>
              <select id="location" name="location">
                <option value="other">Khác</option>
                <option value="hanoi">Hà Nội</option>
                <option value="hcmc">TP. Hồ Chí Minh</option>
              </select>
            </div>
          </div>

          <button id="submit-button" type="submit">Ước tính giá nhà</button>
          <p id="error-message" class="error" role="alert"></p>
        </form>

        <div id="result" class="result" aria-live="polite">
          <div class="result-label">Giá dự đoán</div>
          <div id="price" class="price">—</div>
          <p id="result-detail" class="result-detail"></p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const form = document.querySelector('#prediction-form');
    const button = document.querySelector('#submit-button');
    const result = document.querySelector('#result');
    const price = document.querySelector('#price');
    const resultDetail = document.querySelector('#result-detail');
    const errorMessage = document.querySelector('#error-message');
    const moneyFormatter = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.classList.remove('visible');
      result.classList.remove('visible');
      button.disabled = true;
      button.textContent = 'Đang tính toán...';

      const params = new URLSearchParams({
        area: document.querySelector('#area').value,
        bedrooms: document.querySelector('#bedrooms').value,
        location: document.querySelector('#location').value
      });

      try {
        // Relative URL works because the frontend and API share the same origin.
        const response = await fetch(`/predict?${params.toString()}`);
        if (!response.ok) throw new Error(`API returned ${response.status}`);
        const data = await response.json();

        price.textContent = moneyFormatter.format(data.predicted_price);
        resultDetail.textContent = `${data.area} m² · ${data.bedrooms} phòng ngủ · ${data.location}`;
        result.classList.add('visible');
      } catch (error) {
        errorMessage.textContent = 'Không thể lấy kết quả lúc này. Hãy kiểm tra API và thử lại.';
        errorMessage.classList.add('visible');
      } finally {
        button.disabled = false;
        button.textContent = 'Ước tính giá nhà';
      }
    });
  </script>
</body>
</html>
