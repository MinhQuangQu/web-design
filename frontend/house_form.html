<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House price prediction</title>
</head>
<body>
  <h1>House price prediction</h1>

  <form id="prediction-form">
    <p>
      <label for="area">Area (m²)</label><br />
      <input id="area" name="area" type="number" min="1" step="0.1" />
    </p>
    <p>
      <label for="bedrooms">Bedrooms</label><br />
      <input id="bedrooms" name="bedrooms" type="number" min="0" step="1" />
    </p>
    <p>
      <label for="location">Location</label><br />
      <input id="location" name="location" type="text" placeholder="hanoi, hcmc" />
    </p>
    <button id="submit-button" type="submit">Submit</button>
    <p id="error-message" role="alert" hidden></p>
  </form>

  <section id="result" aria-live="polite" hidden>
    <h2>Result</h2>
    <p id="price"></p>
    <p id="result-detail"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
