<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Items and house price prediction</title>
</head>
<body>
  <main>
    <h1>Items</h1>

    <form id="item-form">
      <input id="item-id" name="id" type="hidden" />
      <p>
        <label for="name">Name</label><br />
        <input id="name" name="name" type="text" required />
      </p>
      <p>
        <label for="price">Price</label><br />
        <input id="price" name="price" type="number" min="0" step="any" required />
      </p>
      <p>
        <label for="in-stock">In stock</label>
        <input id="in-stock" name="in_stock" type="checkbox" checked />
      </p>
      <button id="submit-button" type="submit">Create item</button>
      <button id="cancel-button" type="button" hidden>Cancel edit</button>
    </form>

    <form id="filters-form">
      <h2>Filter, search, sort, and paginate</h2>
      <p>
        <label for="min-price">Minimum price</label>
        <input id="min-price" name="min_price" type="number" min="0" step="any" />
      </p>
      <p>
        <label for="max-price">Maximum price</label>
        <input id="max-price" name="max_price" type="number" min="0" step="any" />
      </p>
      <p>
        <label for="search">Name contains (at least 2 characters)</label>
        <input id="search" name="q" type="search" minlength="2" />
      </p>
      <p>
        <label for="sort-by">Sort by</label>
        <select id="sort-by" name="sort_by">
          <option value="id">ID</option>
          <option value="name">Name</option>
          <option value="price">Price</option>
        </select>
      </p>
      <p>
        <label for="order">Order</label>
        <select id="order" name="order">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </p>
      <p>
        <label for="limit">Items per page</label>
        <input id="limit" name="limit" type="number" min="1" value="10" required />
      </p>
      <button type="submit">Apply filters</button>
      <button id="clear-filters" type="button">Clear filters</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p id="pagination-info"></p>
    <ul id="items-list"></ul>
    <button id="previous-page" type="button" disabled>Previous page</button>
    <button id="next-page" type="button" disabled>Next page</button>

    <section>
      <h2>House price prediction</h2>
      <form id="prediction-form">
        <p>
          <label for="area-sqm">Area (m²)</label><br />
          <input id="area-sqm" name="area_sqm" type="number" min="0.01" step="any" required />
        </p>
        <p>
          <label for="bedrooms">Bedrooms</label><br />
          <input id="bedrooms" name="bedrooms" type="number" min="0" step="1" required />
        </p>
        <p>
          <label for="distance-to-center">Distance to center (km)</label><br />
          <input id="distance-to-center" name="distance_to_center_km" type="number" step="any" required />
        </p>
        <button id="predict-button" type="submit">Predict price</button>
      </form>
      <p id="prediction-result" aria-live="polite"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
